<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact – AshfordLamps</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div id="announcement-bar"></div>
  <div id="site-header"></div>

  <main class="main-content">
    <div class="contact-page">
      <h1 data-i18n="contact.title">Contact Us</h1>
      <form class="contact-form" data-alert-key="contact.form_static" onsubmit="event.preventDefault(); alert(this.getAttribute('data-alert-text') || 'This is a static demo. Form submission is not functional.');">
        <div class="contact-form__field">
          <label for="name" data-i18n="contact.name">Name</label>
          <input type="text" id="name" data-i18n="contact.name_placeholder" placeholder="Your name" required>
        </div>
        <div class="contact-form__field">
          <label for="email" data-i18n="contact.email">Email</label>
          <input type="email" id="email" data-i18n="contact.email_placeholder" placeholder="your@email.com" required>
        </div>
        <div class="contact-form__field">
          <label for="phone" data-i18n="contact.phone">Phone (optional)</label>
          <input type="tel" id="phone" data-i18n="contact.phone_placeholder" placeholder="+1 555 000 0000">
        </div>
        <div class="contact-form__field">
          <label for="message" data-i18n="contact.message">Message</label>
          <textarea id="message" data-i18n="contact.message_placeholder" placeholder="How can we help you?" required></textarea>
        </div>
        <button type="submit" class="btn btn--primary btn--full" data-i18n="contact.send">Send Message</button>
      </form>
      <div class="text-center mt-3" style="font-size:1.4rem; color: rgba(var(--color-text), 0.7);">
        <p><span data-i18n="contact.or_email">Or email us directly at</span> <strong>ehdmarket@gmail.com</strong></p>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>
  <div id="search-modal"></div>

  <script src="js/data-loader.js"></script>
  <script src="js/shared-layout.js"></script>
  <script src="js/product-renderer.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
