backend:
  name: github
  repo: qiwu90995-web/ashford-lamps
  branch: master
  base_url: https://ashford-lamps.vercel.app
  auth_endpoint: /api/auth

media_folder: "images/uploads"
public_folder: "/images/uploads"

site_url: https://ashford-lamps.vercel.app
display_url: https://ashford-lamps.vercel.app
locale: "en"

collections:
  - name: "products"
    label: "Products"
    label_singular: "Product"
    icon: "shopping_bag"
    editor:
      preview: false
    files:
      - label: "All Products"
        name: "all-products"
        file: "content/products.json"
        fields:
          - label: "Products"
            name: "products"
            widget: "list"
            summary: "{{fields.name}} ({{fields.collection}})"
            fields:
              - {label: "ID", name: "id", widget: "string", hint: "URL slug, e.g. darklord"}
              - {label: "Product Name", name: "name", widget: "string"}
              - label: "Collection"
                name: "collection"
                widget: "select"
                options: ["fellowship", "trainers-vault", "spirit-world"]
              - {label: "Pre-order", name: "preorder", widget: "boolean", default: false, required: false}
              - {label: "In Stock", name: "inStock", widget: "boolean", default: true}
              - {label: "Featured on Homepage", name: "featured", widget: "boolean", default: false}
              - {label: "Rating (1-5)", name: "rating", widget: "number", value_type: "int", min: 1, max: 5, default: 5}
              - {label: "Review Count", name: "reviewCount", widget: "number", value_type: "int", default: 0}
              - {label: "Regular Price", name: "priceRegular", widget: "number", value_type: "float", step: 0.01}
              - {label: "Sale Price", name: "priceSale", widget: "number", value_type: "float", step: 0.01}
              - label: "Price Label"
                name: "priceLabel"
                widget: "select"
                options:
                  - {label: "From $XXX", value: "from"}
                  - {label: "Fixed $XXX", value: "fixed"}
              - {label: "Save Percent", name: "savePercent", widget: "number", value_type: "int", min: 0, max: 100}
              - label: "Images"
                name: "images"
                widget: "list"
                summary: "Image {{index}}"
                field:
                  label: "Image URL"
                  name: "url"
                  widget: "string"
                fields:
                  - {label: "Image URL", name: "url", widget: "string"}
              - {label: "Sort Order", name: "sortOrder", widget: "number", value_type: "int", default: 99}

  - name: "settings"
    label: "Site Settings"
    icon: "settings"
    files:
      - label: "General"
        name: "general"
        file: "content/general.json"
        fields:
          - label: "Announcement Bar Messages"
            name: "announcement"
            widget: "object"
            fields:
              - label: "Messages"
                name: "messages"
                widget: "list"
                field:
                  label: "Text"
                  name: "text"
                  widget: "string"
                fields:
                  - {label: "Text", name: "text", widget: "string"}
          - label: "Collections"
            name: "collections"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - {label: "ID", name: "id", widget: "string"}
              - {label: "Display Name", name: "name", widget: "string"}
              - {label: "i18n Key", name: "nameKey", widget: "string"}
              - {label: "Image URL", name: "image", widget: "string"}
              - {label: "Slug", name: "slug", widget: "string"}
              - {label: "Sort Order", name: "sortOrder", widget: "number", value_type: "int", default: 99}
          - label: "Homepage Banners"
            name: "banners"
            widget: "list"
            summary: "Banner {{index}}"
            fields:
              - {label: "Title i18n Key", name: "titleKey", widget: "string"}
              - {label: "Subtitle i18n Key", name: "subtitleKey", widget: "string"}
              - {label: "Background Image URL", name: "image", widget: "string", required: false}
          - {label: "Brand Story i18n Key", name: "brandStoryKey", widget: "string"}
